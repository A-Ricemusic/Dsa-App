<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafbf9" />
    <script>
      try {
        const savedTheme = localStorage.getItem("recall-theme");
        const theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#151a17" : "#fafbf9";
      } catch {}
    </script>
    <meta
      name="description"
      content="A focused practice journal for data structures and algorithms."
    />
    <title>Recall — DSA practice journal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
